name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile add-on source
        run: python -m compileall -q __init__.py core.py tools/build_addon.py
      - name: Build Anki add-on archive
        run: python tools/build_addon.py
      - name: Upload installable add-on
        uses: actions/upload-artifact@v4
        with:
          name: frequency-date-reorder
          path: dist/frequency_date_reorder.ankiaddon
          if-no-files-found: error
